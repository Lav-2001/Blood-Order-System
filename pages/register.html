<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Register</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Poppins", sans-serif;
        background: #fff3f4;
        min-height: 100vh;
    }

    /* Navbar */

    .navbar {
        background: white;
        padding: 14px 0;
        box-shadow: 0 3px 20px rgba(0, 0, 0, 0.06);
    }

    .navbar-brand {
        font-size: 22px;
        font-weight: 800;
        color: #171717;
    }

    .navbar-brand span {
        color: #d71920;
    }

    .brand-icon {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 7px;
        border-radius: 12px;
        background: #fff0f1;
        color: #d71920;
    }

    .home-link {
        color: #555;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }

    .home-link:hover {
        color: #d71920;
    }

    /* Registration Area */

    .register-section {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }

    .register-card {
        width: 100%;
        max-width: 650px;
        background: white;
        padding: 38px;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
    }

    .register-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff0f1;
        color: #d71920;
        border-radius: 50%;
        font-size: 30px;
    }

    .register-title {
        text-align: center;
        font-size: 27px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .register-description {
        text-align: center;
        color: #999;
        font-size: 12px;
        margin-bottom: 28px;
    }

    /* Form */

    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: #444;
    }

    .form-control,
    .form-select {
        height: 48px;
        border: 1px solid #e4e4e4;
        font-size: 12px;
        box-shadow: none !important;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d71920;
    }

    .input-group-text {
        background: white;
        border: 1px solid #e4e4e4;
        color: #999;
    }

    /* Register Button */

    .register-btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 10px;
        background: #d71920;
        color: white;
        font-size: 13px;
        font-weight: 700;
        transition: 0.3s;
    }

    .register-btn:hover {
        background: #a80e14;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(215, 25, 32, 0.20);
    }

    /* Login Link */

    .login-text {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-top: 22px;
    }

    .login-link {
        color: #d71920;
        font-weight: 700;
        text-decoration: none;
    }

    .login-link:hover {
        color: #a80e14;
    }

    /* Responsive */

    @media (max-width: 576px) {

        .register-card {
            padding: 28px 22px;
        }

        .register-title {
            font-size: 24px;
        }

    }

</style>


</head>

<body>

<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar">


<div class="container d-flex justify-content-between align-items-center">

    <!-- Logo -->

    <a href="/index.html" class="navbar-brand">

        <span class="brand-icon">
            <i class="bi bi-droplet-half"></i>
        </span>

        Blood<span>Connect</span>

    </a>

    <!-- Home Link -->

    <a href="../index.html" class="home-link">

        <i class="bi bi-arrow-left me-1"></i>

        Back to Home

    </a>

</div>


</nav>

<!-- =========================
     REGISTRATION SECTION
========================== -->

<section class="register-section">

<div class="register-card">

    <!-- Registration Icon -->

    <div class="register-icon">

        <i class="bi bi-person-plus-fill"></i>

    </div>


    <!-- Heading -->

    <h1 class="register-title">
        Create Account
    </h1>

    <p class="register-description">
        Register to place blood orders through BloodConnect
    </p>


    <!-- Registration Form -->

    <form id="registerForm">

        <div class="row">

            <!-- Full Name -->

            <div class="col-md-6 mb-3">

                <label for="name" class="form-label">
                    Full Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>

            </div>


            <!-- Age -->

            <div class="col-md-6 mb-3">

                <label for="age" class="form-label">
                    Age
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-calendar"></i>
                    </span>

                    <input
                        type="number"
                        id="age"
                        class="form-control"
                        placeholder="Enter your age"
                        min="1"
                        required>

                </div>

            </div>


            <!-- Email -->

            <div class="col-md-6 mb-3">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <!-- Contact Number -->

            <div class="col-md-6 mb-3">

                <label for="contact" class="form-label">
                    Contact Number
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-telephone"></i>
                    </span>

                    <input
                        type="tel"
                        id="contact"
                        class="form-control"
                        placeholder="Enter contact number"
                        required>

                </div>

            </div>


            <!-- Blood Group -->

            <div class="col-md-6 mb-3">

                <label for="bloodGroup" class="form-label">
                    Blood Group
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-droplet"></i>
                    </span>

                    <select
                        id="bloodGroup"
                        class="form-select"
                        required>

                        <option value="" selected disabled>
                            Select blood group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

            </div>


            <!-- Address -->

            <div class="col-md-6 mb-3">

                <label for="address" class="form-label">
                    Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-geo-alt"></i>
                    </span>

                    <input
                        type="text"
                        id="address"
                        class="form-control"
                        placeholder="Enter your address"
                        required>

                </div>

            </div>


            <!-- Password -->

            <div class="col-md-6 mb-3">

                <label for="password" class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="col-md-6 mb-3">

                <label for="confirmPassword" class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        required>

                </div>

            </div>

        </div>


        <!-- Terms -->

        <div class="form-check mb-4">

            <input
                type="checkbox"
                class="form-check-input"
                id="terms"
                required>

            <label
                class="form-check-label"
                for="terms"
                style="font-size: 11px; color: #777;">

                I agree to the terms and conditions

            </label>

        </div>


        <!-- Register Button -->

        <button
            type="submit"
            class="register-btn">

            <i class="bi bi-person-plus me-2"></i>

            Create Account

        </button>

    </form>


    <!-- Login Link -->

    <div class="login-text">

        Already have an account?

        <a href="login.html" class="login-link">
            Login
        </a>

    </div>

</div>


</section>

<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Registration JavaScript -->

<script>

    document
        .getElementById("registerForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const age =
                document.getElementById("age").value;

            const email =
                document.getElementById("email").value;

            const contact =
                document.getElementById("contact").value;

            const bloodGroup =
                document.getElementById("bloodGroup").value;

            const address =
                document.getElementById("address").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* Check Password */

            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;

            }


            /* Check Required Fields */

            if (
                name === "" ||
                age === "" ||
                email === "" ||
                contact === "" ||
                bloodGroup === "" ||
                address === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                alert("Please fill in all fields.");

                return;

            }


            /* Registration Successful */

            alert("Registration successful!");


            /* Redirect to Login */

            window.location.href = "login.html";

        });

</script>

</body>

</html>
