<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Font -->
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Poppins", sans-serif;
        background: #fff3f4;
        min-height: 100vh;
    }

    /* Navbar */

    .navbar {
        background: white;
        padding: 14px 0;
        box-shadow: 0 3px 20px rgba(0, 0, 0, 0.06);
    }

    .navbar-brand {
        font-size: 22px;
        font-weight: 800;
        color: #171717;
    }

    .navbar-brand span {
        color: #d71920;
    }

    .brand-icon {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: 7px;
        border-radius: 12px;
        background: #fff0f1;
        color: #d71920;
    }

    .home-link {
        color: #555;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }

    .home-link:hover {
        color: #d71920;
    }

    /* Login Area */

    .login-section {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }

    .login-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 38px;
        border-radius: 20px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
    }

    .login-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff0f1;
        color: #d71920;
        border-radius: 50%;
        font-size: 30px;
    }

    .login-title {
        text-align: center;
        font-size: 27px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .login-description {
        text-align: center;
        color: #999;
        font-size: 12px;
        margin-bottom: 28px;
    }

    /* Form */

    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: #444;
    }

    .form-control {
        height: 48px;
        border: 1px solid #e4e4e4;
        font-size: 12px;
        box-shadow: none !important;
    }

    .form-control:focus {
        border-color: #d71920;
    }

    .input-group-text {
        background: white;
        border: 1px solid #e4e4e4;
        color: #999;
    }

    .forgot-link {
        color: #d71920;
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
    }

    .forgot-link:hover {
        color: #a80e14;
    }

    /* Login Button */

    .login-btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 10px;
        background: #d71920;
        color: white;
        font-size: 13px;
        font-weight: 700;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #a80e14;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(215, 25, 32, 0.20);
    }

    /* Register */

    .register-text {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin-top: 22px;
    }

    .register-link {
        color: #d71920;
        font-weight: 700;
        text-decoration: none;
    }

    .register-link:hover {
        color: #a80e14;
    }

    /* Responsive */

    @media (max-width: 576px) {

        .login-card {
            padding: 28px 22px;
        }

        .login-title {
            font-size: 24px;
        }

    }

</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar">

    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo -->

        <a href="/index.html" class="navbar-brand">

            <span class="brand-icon">
                <i class="bi bi-droplet-half"></i>
            </span>

            Blood<span>Connect</span>

        </a>


        <!-- Home Link -->

        <a href="../index.html" class="home-link">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Home

        </a>

    </div>

</nav>


<!-- =========================
     LOGIN SECTION
========================== -->

<section class="login-section">

    <div class="login-card">


        <!-- Login Icon -->

        <div class="login-icon">

            <i class="bi bi-person-fill"></i>

        </div>


        <!-- Heading -->

        <h1 class="login-title">
            Welcome Back
        </h1>

        <p class="login-description">
            Login to your BloodConnect account
        </p>


        <!-- Login Form -->

        <form id="loginForm">


            <!-- Email -->

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <!-- Password -->

            <div class="mb-3">

                <div class="d-flex justify-content-between">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                </div>

            </div>


            <!-- Remember Me -->

            <div class="form-check mb-4">

                <input
                    type="checkbox"
                    class="form-check-input"
                    id="remember">

                <label
                    class="form-check-label"
                    for="remember"
                    style="font-size: 11px; color: #777;">

                    Remember me

                </label>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>

        </form>


        <!-- Register -->

        <div class="register-text">

            Don't have an account?

            <a href="register.html" class="register-link">
                Create Account
            </a>

        </div>

    </div>

</section>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Login JavaScript -->

<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("Please enter your email and password.");

                return;

            }

            alert("Login successful!");

            // Redirect to dashboard

            window.location.href = "dashboard.html";

        });

</script>


</body>

</html>
